name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    name: Provisionar Infraestrutura
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.apply.outputs.instance_ip }}
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Terraform Init
        working-directory: ./Terraform
        run: terraform init
      
      - name: Terraform Apply
        id: apply
        working-directory: ./Terraform
        run: |
          terraform apply -auto-approve
          echo "instance_ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

  build:
    name: Build e Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build e Push
        working-directory: ./App
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/projeto-cicd:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/projeto-cicd:latest

  deploy:
    name: Deploy na EC2
    runs-on: ubuntu-latest
    needs: [terraform, build]
    
    steps:
      - name: Aguardar VM inicializar
        run: sleep 150
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ needs.terraform.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker stop web-app || true
            docker rm web-app || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/projeto-cicd:latest
            docker run -d -p 80:80 --name web-app ${{ secrets.DOCKERHUB_USERNAME }}/projeto-cicd:latest

  verify:
    name: Verificar Deploy
    runs-on: ubuntu-latest
    needs: [terraform, deploy]
    
    steps:
      - name: Testar aplicação
        run: |
          sleep 10
          curl -f http://${{ needs.terraform.outputs.instance_ip }} || exit 1
          echo "✅ Aplicação está rodando em: http://${{ needs.terraform.outputs.instance_ip }}"